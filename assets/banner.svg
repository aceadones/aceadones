  <text class="label" x="112" y="112">AMAL KRISHNA</text>
  <text class="name" x="68" y="226" fill="#f4f4f5">ACE ADONES</text>
  <g clip-path="url(#nameclip)"><rect class="sweep" x="-60" y="110" width="280" height="140" fill="url(#shine)" transform="skewX(-20)"/></g>
  <text x="72" y="294" style="font:600 30px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#ff2d55">›</text>
