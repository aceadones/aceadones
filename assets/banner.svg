<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="ACE ADONES, Amal Krishna: AI builder, designer, motion and 3D, violinist">
<title>ACE ADONES</title>
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff"/></pattern>
  <radialGradient id="fade" cx="70%" cy="50%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="dotmask"><rect width="1200" height="420" fill="url(#fade)"/></mask>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <clipPath id="card"><rect width="1200" height="420" rx="22"/></clipPath>
  <clipPath id="nameclip"><text x="68" y="226" class="name">ACE ADONES</text></clipPath>
  <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#ffd1db" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="barfill" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff2d55"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <radialGradient id="core" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#ffd1db" stop-opacity=".9"/><stop offset=".45" stop-color="#ff2d55" stop-opacity=".55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .name{font:800 104px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;letter-spacing:-3px}
  .label{font:500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;letter-spacing:6px;fill:#a1a1aa}
  .role{font:600 30px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#f4f4f5;opacity:0}
  .r0{opacity:1}
  .role{animation:cycle 12s infinite}
  .r0{animation-delay:0s} .r1{animation-delay:3s} .r2{animation-delay:6s} .r3{animation-delay:9s}
  @keyframes cycle{0%{opacity:0;transform:translateY(10px)}4%,21%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-10px)}}
  .sub{font:500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#71717a;letter-spacing:1px}
  .glowA{animation:driftA 14s ease-in-out infinite alternate}
  .glowB{animation:driftB 18s ease-in-out infinite alternate}
  @keyframes driftA{to{transform:translate(180px,50px)}}
  @keyframes driftB{to{transform:translate(-120px,-40px)}}
  .sweep{animation:sweep 5s cubic-bezier(.45,0,.2,1) infinite}
  @keyframes sweep{0%{transform:translateX(-300px)}60%,100%{transform:translateX(900px)}}
  .rb{fill:url(#barfill);opacity:.9;transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.2s ease-in-out infinite alternate}
  @keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
  .spin{transform-origin:985px 212px;animation:spin 24s linear infinite}
  .spinR{transform-origin:985px 212px;animation:spin 40s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .breathe{transform-origin:985px 212px;animation:breathe 4s ease-in-out infinite alternate}
  @keyframes breathe{from{transform:scale(.85);opacity:.7}to{transform:scale(1.08);opacity:1}}
  .pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
  .pill{font:600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#e4e4e7;letter-spacing:2px}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#card)">
  <rect width="1200" height="420" fill="#08080a"/>
  <circle class="glowA" cx="260" cy="110" r="200" fill="#ff2d55" opacity=".28" filter="url(#blur)"/>
  <circle class="glowB" cx="1000" cy="260" r="230" fill="#7c3aed" opacity=".30" filter="url(#blur)"/>
  <rect width="1200" height="420" fill="url(#dots)" opacity=".09" mask="url(#dotmask)"/>

