<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" role="img" aria-label="Teklado by Next Layer Labs: a private, customizable Android keyboard">
<defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#ff2d55"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
<style>
  .t{font:800 30px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#f4f4f5;letter-spacing:-.5px}
  .by{font:500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#a1a1aa;letter-spacing:.5px}
  .d{font:500 14px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#d4d4d8}
  .m{font:500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#71717a}
  .tag{font:600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#e4e4e7;letter-spacing:1px}
  .key{fill:#ffffff;fill-opacity:.05;stroke:#ffffff;stroke-opacity:.10}
  .hot{animation:press 6.0s infinite}
  .enter{animation:press 6.0s infinite}
  @keyframes press{0%,2%{fill:#ff2d55;fill-opacity:.9}12%,100%{fill:#ffffff;fill-opacity:.05}}
  .kl{font:500 10px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#a1a1aa;text-anchor:middle}
  .ico{fill:none;stroke:#a1a1aa;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
  .glide{fill:none;stroke:url(#gl);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;animation:glide 6.0s cubic-bezier(.65,0,.35,1) infinite}
  @keyframes glide{0%{stroke-dashoffset:900;opacity:1}38%{stroke-dashoffset:0;opacity:1}60%,100%{stroke-dashoffset:0;opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
